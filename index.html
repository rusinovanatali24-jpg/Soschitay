&lt;style&gt;
#finger-sheet{color:var(--foreground);position:relative;width:100%;aspect-ratio:16 / 9}
#finger-sheet .fs-stage{position:absolute;inset:0 auto auto 0;width:960px;height:540px;box-sizing:border-box;padding:20px;transform-origin:top left}
#finger-sheet h2{margin:0 0 12px}
#finger-sheet .fs-board{position:relative;display:grid;grid-template-rows:150px 150px;gap:110px;margin-top:24px}
#finger-sheet .fs-column{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;min-width:0;z-index:1}
#finger-sheet .fs-drawing{display:block;width:100%;height:120px;overflow:hidden}
#finger-sheet .fs-choice{touch-action:pan-y}
#finger-sheet .fs-links{position:absolute;width:100%;height:100%;inset:0;overflow:visible;pointer-events:none;z-index:2}
#finger-sheet .fs-links path{fill:none;stroke:var(--viz-series-1);stroke-width:3}
#finger-sheet .fs-links .fs-wrong{stroke:var(--destructive);stroke-dasharray:6 5}
#finger-sheet .fs-links .fs-right{stroke:var(--green)}
#finger-sheet .fs-ink{stroke:var(--foreground);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#finger-sheet .fs-skin{fill:color-mix(in srgb,var(--orange) 28%,var(--background))}
#finger-sheet .fs-item{fill:color-mix(in srgb,var(--viz-series-1) 18%,var(--background))}
&lt;/style&gt;
